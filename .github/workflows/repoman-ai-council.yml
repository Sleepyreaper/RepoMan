name: RepoMan AI council

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: repoman-ai-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI reasoning and remediation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      REPOMAN_ROUTER_MODEL: gpt-5.4-mini
      REPOMAN_REASONER_MODEL: gpt-5.6-terra
      REPOMAN_VERIFIER_MODEL: gpt-5.6-sol
      REPOMAN_EMBEDDING_MODEL: text-embedding-3-large
      SOURCE_PATH: examples/demo/customer/main.tf
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # pull_request_target is privileged. Check out only the trusted base workflow;
      # PR content is fetched as data and restricted to the credential-free demo harness.
      - name: Check out trusted RepoMan code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Install council dependencies
        run: python -m pip install --requirement requirements-ai.txt

      - name: Fetch pull request Terraform as untrusted data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/repoman-input
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/${SOURCE_PATH}?ref=${PR_HEAD_SHA}" \
            --jq .content |
            base64 --decode > /tmp/repoman-input/main.tf

      - name: Enforce credential-free demo boundary
        run: |
          PYTHONPATH=src python src/repoman_council.py guard \
            --source /tmp/repoman-input/main.tf

      - name: Build pull request plan
        run: |
          mkdir -p /tmp/empty-provider-mirror
          terraform -chdir=/tmp/repoman-input init \
            -backend=false \
            -input=false \
            -plugin-dir=/tmp/empty-provider-mirror
          terraform -chdir=/tmp/repoman-input fmt -check -diff
          terraform -chdir=/tmp/repoman-input validate
          terraform -chdir=/tmp/repoman-input plan \
            -input=false -out=/tmp/repoman-input/repoman.tfplan
          terraform -chdir=/tmp/repoman-input show \
            -json /tmp/repoman-input/repoman.tfplan \
            > /tmp/repoman-input/plan.json

      - name: Determine whether remediation is required
        id: gate
        run: |
          set +e
          python src/repoman.py evaluate \
            --policy .repoman/fabrikam-policy.json \
            --plan /tmp/repoman-input/plan.json \
            --repo-root . \
            --plan-only \
            --report /tmp/repoman-input/deterministic.md
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "needs_ai=false" >> "$GITHUB_OUTPUT"
            echo "## RepoMan AI council" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Deterministic checks passed; no remediation PR is needed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" -eq 1 ]]; then
            echo "needs_ai=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Sign in to Azure with GitHub OIDC
        if: steps.gate.outputs.needs_ai == 'true'
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run multi-model review council
        id: council
        if: steps.gate.outputs.needs_ai == 'true'
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src python src/repoman_council.py review \
            --policy .repoman/fabrikam-policy.json \
            --plan /tmp/repoman-input/plan.json \
            --source /tmp/repoman-input/main.tf \
            --output /tmp/repoman-input/review.json \
            --patch /tmp/repoman-input/remediation.patch \
            --report /tmp/repoman-input/review.md \
            2>&1 | tee /tmp/repoman-input/council.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f /tmp/repoman-input/review.json ]]; then
            outcome="$(jq -r '.outcome' /tmp/repoman-input/review.json)"
          else
            outcome="human_review"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Prepare validated remediation
        if: steps.council.outputs.outcome == 'remediation_ready'
        run: |
          jq -j '.reasoner.corrected_file' \
            /tmp/repoman-input/review.json \
            > /tmp/repoman-input/corrected.tf
          test "$(jq -r '.outcome' /tmp/repoman-input/review.json)" = "remediation_ready"
          test "$(jq -r '.verifier.verdict' /tmp/repoman-input/review.json)" = "accept"
          test "$(jq -r '.validation.policy' /tmp/repoman-input/review.json)" = "passed"

      - name: Create or update draft remediation PR
        if: steps.council.outputs.outcome == 'remediation_ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fix_branch="repoman/fix-pr-${PR_NUMBER}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${fix_branch}" >/dev/null 2>&1; then
            tip_message="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${fix_branch}" \
                --jq .commit.message
            )"
            if [[ "$tip_message" != Apply\ RepoMan\ validated\ remediation* ]]; then
              {
                echo ""
                echo "## Human changes detected"
                echo ""
                echo "RepoMan did not overwrite the existing remediation branch."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${fix_branch}" \
              -f sha="$PR_HEAD_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${fix_branch}" \
              -f sha="$PR_HEAD_SHA" >/dev/null
          fi

          file_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/${SOURCE_PATH}?ref=${fix_branch}" \
              --jq .sha
          )"
          encoded_content="$(base64 --wrap=0 /tmp/repoman-input/corrected.tf)"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${SOURCE_PATH}" \
            -f message="Apply RepoMan validated remediation for PR #${PR_NUMBER}" \
            -f content="$encoded_content" \
            -f sha="$file_sha" \
            -f branch="$fix_branch" >/dev/null

          existing_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$fix_branch" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing_pr" ]]; then
            remediation_url="$(
              gh pr view "$existing_pr" \
                --repo "$GITHUB_REPOSITORY" \
                --json url \
                --jq .url
            )"
            gh pr edit "$existing_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RepoMan remediation for PR #${PR_NUMBER}" \
              --body-file /tmp/repoman-input/review.md >/dev/null
          else
            remediation_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --base "$PR_HEAD_REF" \
                --head "$fix_branch" \
                --title "RepoMan remediation for PR #${PR_NUMBER}" \
                --body-file /tmp/repoman-input/review.md
            )"
          fi

          {
            echo ""
            echo "## Draft remediation pull request"
            echo ""
            echo "$remediation_url"
          } >> "$GITHUB_STEP_SUMMARY"

          gh workflow run repoman.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$fix_branch"

      - name: Request human review when the council cannot validate a fix
        if: >-
          always() &&
          steps.gate.outputs.needs_ai == 'true' &&
          steps.council.outputs.outcome == 'human_review'
        run: |
          {
            echo ""
            echo "## Human review required"
            echo ""
            echo "The council did not create a branch because the fix was not independently accepted and policy-clean."
            if [[ -f /tmp/repoman-input/council.log ]]; then
              echo ""
              echo '```text'
              tail -n 20 /tmp/repoman-input/council.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
