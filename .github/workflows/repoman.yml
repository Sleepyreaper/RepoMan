name: RepoMan prototype

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repoman-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RepoMan Terraform policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Install AI test dependencies
        run: python3 -m pip install --requirement requirements-ai.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Terraform formatting
        run: terraform -chdir=examples/terraform/valid fmt -check -diff

      - name: Initialize example
        run: terraform -chdir=examples/terraform/valid init -backend=false -input=false

      - name: Validate example
        run: terraform -chdir=examples/terraform/valid validate

      - name: Build demo Terraform plan
        run: |
          PYTHONPATH=src python3 src/repoman_council.py guard \
            --source examples/demo/customer/main.tf
          mkdir -p /tmp/empty-provider-mirror
          terraform -chdir=examples/demo/customer init \
            -backend=false \
            -input=false \
            -plugin-dir=/tmp/empty-provider-mirror
          terraform -chdir=examples/demo/customer fmt -check -diff
          terraform -chdir=examples/demo/customer validate
          terraform -chdir=examples/demo/customer plan -input=false -out=/tmp/repoman-demo.tfplan
          terraform -chdir=examples/demo/customer show -json /tmp/repoman-demo.tfplan > /tmp/repoman-demo-plan.json

      - name: Verify approval path
        id: approved
        uses: ./
        with:
          policy-file: .repoman/policy.json
          plan-json: examples/plans/approved.json
          report-file: /tmp/repoman-approved.md

      - name: Assert approval
        env:
          DECISION: ${{ steps.approved.outputs.decision }}
        run: test "$DECISION" = "approve"

      - name: Verify denial path and remediation
        id: denied
        uses: ./
        with:
          policy-file: .repoman/policy.json
          plan-json: examples/plans/denied.json
          report-file: /tmp/repoman-denied.md
          fail-on-deny: "false"

      - name: Assert denial
        env:
          DECISION: ${{ steps.denied.outputs.decision }}
        run: |
          test "$DECISION" = "deny"
          grep -q "How to fix" /tmp/repoman-denied.md

      - name: Evaluate the pull request plan
        uses: ./
        with:
          policy-file: .repoman/fabrikam-policy.json
          plan-json: /tmp/repoman-demo-plan.json
          report-file: /tmp/repoman-pr-decision.md
